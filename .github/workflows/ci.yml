# Type check, lint, test and build on every pull request and push to main,
# so a release tag only ever points at a commit that already passed.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and test
        run: |
          npx tsc --noEmit -p .
          npm run lint
          npm test

      - name: Build plugin
        run: npm run build

      - name: Build leaves the tree clean
        run: git diff --exit-code
