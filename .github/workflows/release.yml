# Builds the plugin when a version tag is pushed, signs the release assets
# with a build provenance attestation, and creates a draft GitHub release.
# Based on the Obsidian guide "Release your plugin with GitHub Actions".
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Install pdftoppm (poppler) for the slide render tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and test
        run: |
          npx tsc --noEmit -p .
          npm run lint
          npm test

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="Alt2Obs $tag" \
            --draft \
            main.js manifest.json styles.css
